services:
  db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: underwrite
      POSTGRES_USER: underwrite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U underwrite -d underwrite"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      args:
        VITE_REGISTRY_CONTRACT_ID: ${VITE_REGISTRY_CONTRACT_ID:-}
    image: near-underwrite:local
    environment: &api-env
      DATABASE_URL: postgresql://underwrite:${POSTGRES_PASSWORD}@db:5432/underwrite
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:4173}
      COLLECTOR_EMBEDDED: "false"
      PORT: "8787"
      HOST: 0.0.0.0
      GENERIC_AI_ALLOWED_HOSTS: ${GENERIC_AI_ALLOWED_HOSTS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  collector:
    image: near-underwrite:local
    command: ["node", "apps/api/dist/collector-service.js"]
    environment:
      <<: *api-env
      COLLECT_INTERVAL_MS: "60000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  web:
    image: near-underwrite:local
    command: ["node", "scripts/static-server.mjs"]
    environment:
      API_PROXY_TARGET: http://api:8787
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  pgdata:
