[package]
name = "near-underwrite-registry"
version = "1.0.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Append-only NEAR UNDERWRITE research publication commitment registry"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"

[dev-dependencies]
anyhow = "1.0.100"
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
near-workspaces = "0.24.0"
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true

[workspace]
